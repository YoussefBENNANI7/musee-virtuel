<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Musée virtuel</title>
    <style>
      /* Écran de chargement : écrit ici pour s'afficher tout de suite, avant le reste de l'interface. */
      .splash {
        position: fixed;
        inset: 0;
        z-index: 40;
        display: grid;
        place-items: center;
        background: #f8f4e9;
        transition: opacity 0.6s;
      }
      .splash svg {
        width: 56px;
        height: 56px;
        fill: #a8472a;
        animation: splash 1.6s ease-in-out infinite;
      }
      @keyframes splash {
        50% {
          opacity: 0.35;
          transform: scale(0.86) rotate(22.5deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .splash svg {
          animation: none;
        }
      }
      .ready .splash,
      .failed .splash {
        opacity: 0;
        pointer-events: none;
      }
    </style>
  </head>
  <body>
    <div class="splash" aria-hidden="true">
      <svg viewBox="-12 -12 24 24"><path d="M0-11 3.2-7.7 7.8-7.8 7.7-3.2 11 0 7.7 3.2 7.8 7.8 3.2 7.7 0 11-3.2 7.7-7.8 7.8-7.7 3.2-11 0-7.7-3.2-7.8-7.8-3.2-7.7z" /></svg>
    </div>
    <canvas id="scene" aria-label="Visite virtuelle en 3D"></canvas>

    <header id="bar" class="bar">
      <div>
        <h1 id="museum-name"></h1>
        <p id="room-name"></p>
        <a id="museums-link" class="museums-link" href="./" hidden></a>
        <button id="room-intro" class="room-intro" type="button" hidden></button>
      </div>
      <div class="tools">
        <button id="tours-open" type="button"></button>
        <button id="map-open" type="button"></button>
        <button id="carnet-open" type="button"></button>
        <button id="vr" type="button" hidden></button>
        <button id="mode" type="button"></button>
        <select id="lang"></select>
        <button id="sound" class="icon-only" type="button" hidden></button>
      </div>
    </header>

    <button id="minimap" class="minimap" type="button"></button>

    <p id="help" class="help"></p>

    <div id="joystick" class="joystick" aria-hidden="true"><span></span></div>

    <aside id="panel" class="panel" role="dialog" aria-labelledby="p-title" hidden>
      <button id="p-close" class="close" type="button">×</button>
      <p id="p-artist" class="artist"></p>
      <h2 id="p-title"></h2>
      <p id="p-meta" class="meta"></p>
      <button id="p-audio" class="btn" type="button"></button>
      <button id="p-witness" class="btn" type="button" hidden></button>
      <button id="p-zoom" class="btn" type="button" hidden></button>
      <p id="p-desc" class="desc"></p>
      <figure id="p-photo" class="photo" hidden>
        <button id="p-photo-open" type="button"><img alt="" /></button>
        <figcaption></figcaption>
      </figure>
      <p id="p-credit" class="credit" hidden></p>
      <nav id="tour-nav" class="tour-nav" hidden>
        <p id="tour-status"></p>
        <div class="row">
          <button id="tour-prev" class="btn" type="button"></button>
          <button id="tour-next" class="btn primary" type="button"></button>
        </div>
        <button id="tour-auto" class="link" type="button"></button>
        <button id="tour-quit" class="link" type="button"></button>
      </nav>
    </aside>

    <div id="tour-resume" class="resume" hidden>
      <button id="tour-resume-btn" class="btn primary" type="button"></button>
      <button id="tour-resume-quit" class="btn" type="button">×</button>
    </div>

    <div id="map" class="overlay" hidden>
      <section class="map-card" role="dialog" aria-labelledby="map-title">
        <button id="map-close" class="close" type="button">×</button>
        <h2 id="map-title"></h2>
        <p id="map-hint" class="meta"></p>
        <div id="map-body"></div>
      </section>
    </div>

    <div id="tours" class="overlay" hidden>
      <section class="map-card" role="dialog" aria-labelledby="tours-title">
        <button id="tours-close" class="close" type="button">×</button>
        <h2 id="tours-title"></h2>
        <p id="tours-hint" class="meta"></p>
        <div id="tours-body"></div>
      </section>
    </div>

    <div id="carnet" class="overlay" hidden>
      <section class="map-card" role="dialog" aria-labelledby="carnet-title">
        <button id="carnet-close" class="close" type="button">×</button>
        <h2 id="carnet-title"></h2>
        <p id="carnet-hint" class="meta"></p>
        <div id="carnet-bar" class="carnet-bar" aria-hidden="true"></div>
        <div id="carnet-body"></div>
        <button id="carnet-reset" class="link" type="button"></button>
      </section>
    </div>

    <p id="toast" class="toast" role="status" hidden></p>

    <div id="zoom" class="zoom" role="dialog" aria-modal="true" tabindex="-1" hidden>
      <div id="zoom-stage" class="zoom-stage">
        <div id="zoom-sheet" class="zoom-sheet"><img id="zoom-img" alt="" draggable="false" /><div id="zoom-dots"></div></div>
      </div>
      <p id="zoom-hint" class="zoom-hint"></p>
      <aside id="zoom-detail" class="zoom-detail" aria-live="polite" hidden>
        <p id="zoom-detail-count" class="count"></p>
        <h3 id="zoom-detail-title"></h3>
        <p id="zoom-detail-text" class="text"></p>
        <div class="row">
          <button id="zoom-detail-prev" class="btn" type="button"></button>
          <button id="zoom-detail-all" class="link" type="button"></button>
          <button id="zoom-detail-next" class="btn primary" type="button"></button>
        </div>
      </aside>
      <div class="zoom-tools">
        <button id="zoom-out" class="zoom-btn" type="button">−</button>
        <button id="zoom-in" class="zoom-btn" type="button">+</button>
        <button id="zoom-close" class="zoom-btn" type="button">×</button>
      </div>
    </div>

    <div id="inspect" class="inspect" role="dialog" aria-modal="true" tabindex="-1" hidden>
      <p id="inspect-hint" class="zoom-hint"></p>
      <div class="zoom-tools">
        <button id="inspect-spin" class="zoom-btn" type="button" aria-pressed="false">↻</button>
        <button id="inspect-out" class="zoom-btn" type="button">−</button>
        <button id="inspect-in" class="zoom-btn" type="button">+</button>
        <button id="inspect-close" class="zoom-btn" type="button">×</button>
      </div>
    </div>

    <main id="simple" class="simple-page" hidden></main>

    <div id="config-errors" class="config-errors" role="alert" hidden></div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
